services:
  assistant:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    ports:
      - "${ASSISTANT_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
    cpus: 2
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
