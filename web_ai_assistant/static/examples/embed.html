<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>校務 AI 助理嵌入範例</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #1e293b; background: #eef2ff; }
    main { width: min(620px, calc(100% - 40px)); padding: 36px; border-radius: 20px; background: #fff; box-shadow: 0 18px 50px rgba(30,41,59,.12); }
    h1 { margin-top: 0; }
    code { padding: 2px 5px; border-radius: 5px; background: #f1f5f9; }
  </style>
</head>
<body>
  <main>
    <h1>校務系統嵌入測試頁</h1>
    <p>右下角按鈕由獨立的 <code>embed.js</code> 載入。可在網址加上 <code>?assistant=https://助理主機/</code> 測試跨來源部署。</p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var base = params.get("assistant") || "http://127.0.0.1:8000/";
      var loader = document.createElement("script");
      loader.src = new URL("embed.js", base).href;
      loader.defer = true;
      loader.dataset.assistantUrl = base;
      loader.dataset.name = "校務 AI 助理";
      loader.dataset.color = "#4f46e5";
      document.head.appendChild(loader);
    }());
  </script>
</body>
</html>
